name: CI

# Runs on every push and PR. Gate keeping: gofmt is clean, go vet is
# clean, build compiles, tests pass. Cheap to run, fast to fail.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The finance, lends, captures, MCP and AI-tool tests need a scratch
    # Postgres; without SAJNI_TEST_DATABASE_URL they skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sajni_test
          POSTGRES_PASSWORD: sajni_test
          POSTGRES_DB: sajni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sajni_test -d sajni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAJNI_TEST_DATABASE_URL: postgres://sajni_test:sajni_test@localhost:5432/sajni_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files. Run 'make fmt' locally:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -p 1: the DB tests share one database and migrate it on open.
        run: go test -p 1 ./...
